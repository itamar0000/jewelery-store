# Local development database only.
#
# These credentials are development-only and are deliberately committed so that
# `npm run db:up` works with no setup. They must never be reused anywhere else.
# Production Postgres is a managed host with its own credentials, supplied
# through the environment (TBD.md I3).

# The Compose project name is set explicitly. Compose normally derives it from
# the directory name, which here is Hebrew ("אתר חנות תכשיטים") and normalises
# to an empty string, making every Compose command fail with
# "project name must not be empty". See docs/DECISIONS.md D1.8.
name: jewelry-store

services:
  postgres:
    image: postgres:16-alpine
    container_name: jewelry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jewelry
      POSTGRES_USER: jewelry
      POSTGRES_PASSWORD: jewelry_local_dev
      # Deterministic collation, so index and ORDER BY behaviour does not
      # depend on the host locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Host port 5433, not 5432, on purpose. A machine that already runs a
      # PostgreSQL - a system install, or another project's container - holds
      # 5432, and Compose then fails with "port is already allocated". Using a
      # dedicated port means this project starts regardless of what else is
      # running. The container still listens on 5432 internally.
      - '5433:5432'
    volumes:
      - jewelry-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jewelry -d jewelry']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ------------------------------------------------------------------ media
  #
  # MinIO speaks the S3 API, so the storage adapter runs against a REAL
  # endpoint locally and in CI - no cloud account, no mocked client. That is a
  # large part of why S3-compatible storage was chosen over a hosted
  # transformation service (docs/MEDIA_STORAGE_DECISION.md).
  #
  # Started on demand with `npm run media:up`, not by `npm run db:up`, because
  # the storefront renders perfectly well without it.
  #
  # These credentials are development-only and deliberately committed, exactly
  # like the Postgres ones above. They must never be reused anywhere else.
  minio:
    image: minio/minio:latest
    container_name: jewelry-minio
    restart: unless-stopped
    profiles: ['media']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jewelry_dev
      MINIO_ROOT_PASSWORD: jewelry_local_dev
    ports:
      # 9000 is the S3 API, 9001 the web console. Both are host ports that a
      # developer may already be using; change them here if so.
      - '9000:9000'
      - '9001:9001'
    volumes:
      - jewelry-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  jewelry-postgres-data:
  jewelry-minio-data:
