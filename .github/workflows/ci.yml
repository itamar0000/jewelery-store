name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Integration tests run against a real PostgreSQL. The reservation race,
    # the CHECK constraints and the NULLS NOT DISTINCT wishlist index live in
    # the database and cannot be asserted against a mock, so CI provides one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jewelry
          POSTGRES_USER: jewelry
          POSTGRES_PASSWORD: jewelry_local_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jewelry -d jewelry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # CI-only credentials for a throwaway container. Not a secret.
      DATABASE_URL: postgresql://jewelry:jewelry_local_dev@localhost:5433/jewelry?schema=public
      TEST_DATABASE_URL: postgresql://jewelry:jewelry_local_dev@localhost:5433/jewelry_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, so the client exists before the
      # type check.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Vitest's global setup creates the test database and runs
      # `prisma migrate deploy` against it, so the tests exercise the real
      # migration rather than a pushed schema.
      - run: npm test

      - run: npm run build

      - run: npm run format:check
